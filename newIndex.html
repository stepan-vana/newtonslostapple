    <button id="themeToggle" style="cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; margin: 15px;">
      <img src="./assets/sun.svg" alt="theme mngr" id="themeIconImg">
    </button>
  </nav>
  <div id="content">

    <div id="table">
    <table>
      <thead>
        <th style="border-top-left-radius: 20px;">Title</th>

          <td><a href="./templates/linux.html">Linux</a></td>

    </div>

</body>
<footer>
  <p>© 2026, Newton's lost apple. All rights reserved.</p>
</footer>
<style>
  * {
    font-family: "Stack Sans Headline", sans-serif;
    margin: 0;
  }
  nav {
    height: 60px;
    padding: 0;
    display: flex;
    align-items: center;
    padding-left: 20px;
    justify-content: space-between;
  }
  #content p, #content h1 {
    margin-left: 20px;
  }
  #logo {
    height: 40px;
    width: auto;
  }
  #content {
    padding: 0;
  }
  td {
    border: 1px solid black;
    font-size: 20px;
    padding: 10px;
  }
  #table {
    width: 100%;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  th {
    font-size: 40px;
    padding: 20px;
    border: 1px solid black;
    width: 200px;
  }
  footer {
    height: 100px;
    width: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .dark {
    background-color: black;
    color: white;
  }
  .dark nav {
    background-color: rgb(22, 22, 22);
  }
</style>
<script>
  function applyTheme(dark) {
        if (dark) {
          document.body.classList.add("dark");
          document.getElementById("themeToggle").innerText = "Light mode";
          document.getElementById("themeIconImg").src = "../assets/sun.svg";
          document.getElementById("themeIconImg").alt = "Light mode";
        } else {
          document.body.classList.remove("dark");
          document.getElementById("themeToggle").innerText = "Dark mode";
          document.getElementById("themeIconImg").src = "../assets/moon.svg";
          document.getElementById("themeIconImg").alt = "Dark mode";
        }
      }

      document.getElementById("themeToggle").addEventListener("click", () => {
        applyTheme(!document.body.classList.contains("dark"));
      });

      document.getElementById("themeIconBtn").addEventListener("click", () => {
        applyTheme(!document.body.classList.contains("dark"));
      });

      document.getElementById("hamburgerBtn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
      });

</script>
</html>
