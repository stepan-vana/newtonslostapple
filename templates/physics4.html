<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NLA | Physics</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
      onload="window.katexReady = true"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      /* NAVBAR */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: white;
        border-bottom: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        z-index: 1000;
      }

      .logo img {
        height: 36px;
        display: block;
      }

      /* SIDEBAR (desktop default) */
      .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        bottom: 0;
        width: 15rem;
        padding: 25px;
        background: #f4f4f4;
        border: 1px solid #bbb;
        border-top: none;
        overflow: auto;
      }

      /* RIGHT SIDEBAR */
      .sidebar-left {
        position: fixed;
        top: 80px;
        right: 20px;
        width: 250px;
        padding: 20px;
        background: #f4f4f4;
        border: 1px solid #bbb;
      }

      /* CONTENT */
      .content {
        margin-top: 70px;
        margin-left: 15rem;
        margin-right: 270px;
        padding: 20px 30px;
      }

      /* TOC */
      .toc a {
        display: block;
        text-decoration: none;
        color: black;
        margin: 4px 0;
        font-size: 14px;
      }

      .toc .h1 {
        font-weight: bold;
      }
      .toc .h2 {
        margin-left: 10px;
      }
      .toc .h3 {
        margin-left: 20px;
      }

      /* TABLE */
      .content table,
      .content th,
      .content td {
        border: 1px solid #ccc;
        border-collapse: collapse;
      }

      .content th,
      .content td {
        padding: 8px;
      }

      /* CODE BLOCKS */
      .content pre {
        border: 1px solid #ccc;
        margin: 10px 0;
        display: block;
        max-width: 100%;
        width: 100%;
      }

      .code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ccc;
        padding: 4px 8px;
        font-size: 12px;
      }

      .copy-btn {
        font-size: 12px;
        border: 1px solid #ccc;
        background: white;
        cursor: pointer;
        padding: 2px 6px;
      }

      .code-body {
        padding: 10px;
        background-color: #f8f8f8;
        white-space: pre;
        overflow-x: auto;
        font-family: monospace;
        display: block;
      }

      /* DROPDOWN */
      .sidebar ul {
        list-style: none;
      }

      .dropdown-toggle {
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      .icon {
        width: 14px;
        height: 14px;
        transition: transform 0s ease;
        display: inline-block;
        color: black;
      }

      .dropdown.open .icon {
        transform: rotate(90deg);
      }

      .dropdown-menu {
        display: none;
        margin-left: 18px;
        flex-direction: column;
      }

      .dropdown.open .dropdown-menu {
        display: flex;
      }

      /* DARK MODE */
      .dark {
        background: #000 !important;
        color: #fff !important;
      }

      .dark .sidebar,
      .dark .sidebar-left,
      .dark .content {
        background: #000 !important;
        color: #fff !important;
      }

      .dark a {
        color: #fff !important;
      }

      .dark .code-body {
        background-color: #000;
      }

      .dark .icon {
        color: #fff;
      }

      /* NAV BUTTON
      .navbar button {
        border: 1px solid #ccc;
        background-color: transparent;
      }

      /* ========== MOBILE FIX (Z KÓDU 2) ========== */

      @media (max-width: 1024px) {
        .sidebar-left {
          display: none;
        }

        .content {
          margin-right: 0;
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          left: auto;
          right: 0;
          width: min(15rem, 85vw);
          border-left: 1px solid #bbb;
          border-right: none;

          transform: translateX(100%);
          transition: transform 0.3s ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .content {
          margin-left: 0;
          margin-right: 0;
          padding: 16px;
        }
      }

      /* HAMBURGER BUTTON */
      .hamburger {
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 36px;
        height: 36px;
        background: transparent;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        padding: 6px;
      }

      .hamburger span {
        display: block;
        height: 2px;
        background: black;
        border-radius: 2px;
      }

      /* DARK MODE ICON */
      .dark .hamburger span {
        background: white;
      }

      /* MOBILE BEHAVIOR */
      @media (max-width: 768px) {
        .hamburger {
          display: flex;
        }

        .sidebar {
          left: auto;
          right: 0;
          width: min(15rem, 85vw);
          border-left: 1px solid #bbb;
          border-right: none;

          transform: translateX(100%);
          transition: transform 0.3s ease;
          z-index: 999;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .sidebar-left {
          display: none;
        }

        .content {
          margin-left: 0;
          margin-right: 0;
          padding: 16px;
        }
      }
      .theme-icon-btn img {
        width: 22px;
        height: 22px;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Otevřít navigaci">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo">
        <a href="https://newtonslostapple.com/index.html">
          <img src="../assets/newtons_lost_apple.png" alt="logo" />
        </a>
      </div>

      <div style="display: flex; align-items: center; gap: 12px">
        <button id="themeToggle" style="padding: 6px 10px; cursor: pointer">
          <img id="themeIconImg" src="../assets/moon.svg" alt="Dark mode" />
        </button>
      </div>
    </div>

    <div class="sidebar">
      <p><b>Physics</b></p>
      <br />

      <ul>
        <li class="dropdown">
          <div
            class="dropdown-toggle"
            data-md="../docs/physics/kinematics-intro.md"
          >
            <svg class="icon" viewBox="0 0 24 24">
              <path
                d="M8 5l8 7-8 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>

            Kinematics
          </div>

          <div class="dropdown-menu">
            <a href="#" data-md="../docs/physics/velocity.md">Velocity</a>
            <a href="#" data-md="../docs/physics/acceleration.md"
              >Acceleration</a
            >
          </div>
        </li>
      </ul>
    </div>

    <div class="content" id="content"></div>

    <div class="sidebar-left">
      <p><b>DOCUMENT SECTIONS</b></p>
      <br />
      <div class="toc" id="toc"></div>
    </div>

    <script>
      document.getElementById("hamburgerBtn").addEventListener("click", () => {
        document.querySelector(".sidebar").classList.toggle("open");
      });
      document.addEventListener("click", (e) => {
        const sidebar = document.querySelector(".sidebar");
        const hamburger = document.getElementById("hamburgerBtn");

        if (!sidebar.contains(e.target) && !hamburger.contains(e.target)) {
          sidebar.classList.remove("open");
        }
      });
      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/[^\w\s-]/g, "")
          .replace(/\s+/g, "-");
      }

      function buildTOC(html) {
        const temp = document.createElement("div");
        temp.innerHTML = html;

        const headers = temp.querySelectorAll("h1, h2, h3");

        const toc = document.getElementById("toc");
        toc.innerHTML = "";

        headers.forEach((h) => {
          const id = slugify(h.innerText);
          h.id = id;

          const a = document.createElement("a");
          a.href = "#" + id;
          a.innerText = h.innerText;

          if (h.tagName === "H1") a.classList.add("h1");
          if (h.tagName === "H2") a.classList.add("h2");
          if (h.tagName === "H3") a.classList.add("h3");

          toc.appendChild(a);
        });

        return temp.innerHTML;
      }

      function enhanceCodeBlocks() {
        document.querySelectorAll(".content pre").forEach((pre) => {
          if (pre.dataset.done) return;
          pre.dataset.done = "1";

          const code = pre.querySelector("code");
          if (!code) return;

          const lang =
            (code.className || "").replace("language-", "") || "code";

          const header = document.createElement("div");
          header.className = "code-header";

          const left = document.createElement("div");
          left.innerText = lang;

          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.innerText = "copy";

          btn.addEventListener("click", () => {
            navigator.clipboard.writeText(code.innerText);
            btn.innerText = "copied";
            setTimeout(() => (btn.innerText = "copy"), 1000);
          });

          header.appendChild(left);
          header.appendChild(btn);

          const body = document.createElement("div");
          body.className = "code-body";
          body.innerText = code.innerText;

          pre.innerHTML = "";
          pre.appendChild(header);
          pre.appendChild(body);
        });
      }

      function renderKaTeX() {
        if (window.renderMathInElement) {
          renderMathInElement(document.getElementById("content"), {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
            throwOnError: false,
          });
        }
      }

      document.querySelectorAll(".dropdown-toggle").forEach((el) => {
        el.addEventListener("click", () => {
          el.parentElement.classList.toggle("open");
        });
      });

      async function loadMD(file) {
        const res = await fetch(file);
        const text = await res.text();

        let html = marked.parse(text);
        html = buildTOC(html);

        document.getElementById("content").innerHTML = html;

        enhanceCodeBlocks();
        renderKaTeX();
      }

      document.querySelectorAll("[data-md]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          loadMD(el.dataset.md);
        });
      });

      const btn = document.getElementById("themeToggle");
      /*
btn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        btn.innerText = "Light mode";
    } else {
        btn.innerText = "Dark mode";
    }
});*/
      function applyTheme(dark) {
        if (dark) {
          document.body.classList.add("dark");
          //document.getElementById("themeToggle").innerText = "Light mode";
          document.getElementById("themeIconImg").src = "../assets/sun.svg";
          document.getElementById("themeIconImg").alt = "Light mode";
        } else {
          document.body.classList.remove("dark");
          //document.getElementById("themeToggle").innerText = "Dark mode";
          document.getElementById("themeIconImg").src = "../assets/moon.svg";
          document.getElementById("themeIconImg").alt = "Dark mode";
        }
      }
      document.getElementById("themeToggle").addEventListener("click", () => {
        applyTheme(!document.body.classList.contains("dark"));
      });
      document.getElementById("themeIconBtn").addEventListener("click", () => {
        applyTheme(!document.body.classList.contains("dark"));
      });
      loadMD("../docs/physics/introduction.md");
    </script>
  </body>
</html>
